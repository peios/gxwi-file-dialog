[package]
name = "gxwi-file-dialog"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

# The library is what a program that opens the dialog needs: the protocol and
# a way to start it. It has nothing of GXWI's in it, so a program depending
# on it with `default-features = false` gets nothing of the dialog's.
[lib]
path = "src/lib.rs"

[[bin]]
name = "gxwi-file-dialog"
path = "src/main.rs"
required-features = ["program"]

[features]
default = ["program"]
program = ["dep:libgxwi", "dep:libc", "dep:peios", "dep:jiff"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# libgxwi as of the gxwi release dev.peios.gxwi-sdk stages, which a package
# build takes it from (gxwi's dev/pins.toml).
libgxwi = { git = "https://github.com/peios/gxwi.git", rev = "e9d86e56e8d79b4240ff5114434b4cdc0c5b1f76", optional = true }
# What the person may do in a folder, asked of KACS. The revision libgxwi
# pins, which it must: a program can hold only one peios-sys.
peios = { git = "https://github.com/peios/peios-rs.git", rev = "f8c84930f2b71763bcf0550df0b1420a0f63b21e", package = "peios", optional = true }
libc = { version = "0.2", optional = true }
# When a file last changed, on this machine's clock.
jiff = { version = "0.2.29", optional = true }
